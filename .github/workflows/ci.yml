name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck provider scripts
        run: shellcheck actions/notify/providers/*.sh

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run zizmor (workflow security lint)
        run: |
          pipx install zizmor
          zizmor --persona=pedantic .
